name: Build and Release NV-KeepAlive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile nv-keepalive (linux-x86_64)
        run: |
          mkdir -p linux/bin
          gcc -O2 -Wall -Wextra -pthread linux/nv_keepalive.c -ldl -o linux/bin/nv-keepalive-linux-x86_64
          strip linux/bin/nv-keepalive-linux-x86_64
          ./linux/bin/nv-keepalive-linux-x86_64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: linux/bin/nv-keepalive-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile NvKeepAlive.exe and NvKeepAliveUI.exe (.NET Framework csc.exe)
        shell: cmd
        run: |
          call windows\src\build-windows.bat
          windows\NvKeepAlive.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bins
          path: |
            windows/NvKeepAlive.exe
            windows/NvKeepAliveUI.exe

  package-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: linux/bin
      - uses: actions/download-artifact@v4
        with:
          name: windows-bins
          path: windows
      - name: Create release archive
        run: |
          chmod +x linux/bin/nv-keepalive-linux-x86_64 linux/install-linux.sh linux/uninstall-linux.sh
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then TAG="dev-${GITHUB_SHA::7}"; fi
          ARCHIVE="NV-KeepAlive-${TAG}.zip"
          zip -r "${ARCHIVE}" README.md README.ru.md LICENSE src windows linux -x "*.git*"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ env.ARCHIVE }}
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
