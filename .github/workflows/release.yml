name: Build and Release NV-KeepAlive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile nv-keepalive (linux-x86_64)
        run: |
          mkdir -p linux/bin
          gcc -O2 -Wall -Wextra -pthread linux/nv_keepalive.c -ldl -o linux/bin/nv-keepalive-linux-x86_64
          strip linux/bin/nv-keepalive-linux-x86_64
          ./linux/bin/nv-keepalive-linux-x86_64 --help
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: linux/bin/nv-keepalive-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile NvKeepAlive.exe and NvKeepAliveUI.exe (.NET Framework csc.exe)
        shell: cmd
        run: |
          call windows\src\build-windows.bat
          windows\NvKeepAlive.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bins
          path: |
            windows/NvKeepAlive.exe
            windows/NvKeepAliveUI.exe

  package-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: linux/bin
      - uses: actions/download-artifact@v4
        with:
          name: windows-bins
          path: windows
      - name: Create clean per-OS release archives
        run: |
          chmod +x linux/bin/nv-keepalive-linux-x86_64 linux/install-linux.sh linux/uninstall-linux.sh
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then TAG="dev-${GITHUB_SHA::7}"; fi

          WIN_ARCHIVE="NV-KeepAlive-Windows-${TAG}.zip"
          LIN_ARCHIVE="NV-KeepAlive-Linux-${TAG}.tar.gz"

          rm -rf dist_win dist_lin
          mkdir -p dist_win dist_lin/bin

          # Windows release: ready-to-run executables right in the root folder
          cp windows/NvKeepAliveUI.exe windows/NvKeepAlive.exe README.md README.ru.md LICENSE dist_win/
          (cd dist_win && zip -r "../${WIN_ARCHIVE}" .)

          # Linux release: prebuilt binary + installer + service + C fallback source
          cp linux/bin/nv-keepalive-linux-x86_64 dist_lin/bin/
          cp linux/install-linux.sh linux/uninstall-linux.sh linux/nv-keepalive.service linux/nv_keepalive.c linux/Makefile README.md README.ru.md LICENSE dist_lin/
          chmod +x dist_lin/bin/nv-keepalive-linux-x86_64 dist_lin/install-linux.sh dist_lin/uninstall-linux.sh
          tar -czf "${LIN_ARCHIVE}" -C dist_lin .

          sha256sum "${WIN_ARCHIVE}" "${LIN_ARCHIVE}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "WIN_ARCHIVE=${WIN_ARCHIVE}" >> "$GITHUB_ENV"
          echo "LIN_ARCHIVE=${LIN_ARCHIVE}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            ${{ env.WIN_ARCHIVE }}
            ${{ env.LIN_ARCHIVE }}
            SHA256SUMS.txt
      - name: Clean obsolete release assets (if re-tagging)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete-asset "${GITHUB_REF_NAME}" "NV-KeepAlive-${GITHUB_REF_NAME}.zip" -y 2>/dev/null || true
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NV-KeepAlive ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.WIN_ARCHIVE }}
            ${{ env.LIN_ARCHIVE }}
            SHA256SUMS.txt
